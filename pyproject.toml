[project]
name = "vision-measurement-platform"
version = "0.1.0"
description = "Reusable camera calibration, video correction and measurement tools"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.8,<5",
    "typer>=0.12,<1",
    "streamlit>=1.35,<2",
    "pandas>=2.0,<3",
]

[project.scripts]
vmeasure = "vision_measurement.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
