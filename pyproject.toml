[project]
name = "vision-measurement-platform"
version = "0.1.1"
description = "Reusable camera calibration, video correction and measurement tools"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "numpy>=2.5.4,<3",
    "opencv-python-headless>=5.0.0.93,<6",
    "typer>=0.20,<1",
    "streamlit>=1.66.1,<2",
    "pandas>=3.1.0,<4",
    "Pillow>=13.0,<14",
    "streamlit-image-coordinates==0.4.1",
    "streamlit-cropper==0.3.1",
]

[project.scripts]
vmeasure = "vision_measurement.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

# Distribution and Python import package have different names.
[tool.hatch.build.targets.wheel]
packages = ["src/vision_measurement"]

[tool.pytest.ini_options]
testpaths = ["tests"]
